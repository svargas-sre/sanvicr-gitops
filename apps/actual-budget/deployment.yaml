apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-budget
  labels:
    app.kubernetes.io/name: actual-budget
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: actual-budget
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actual-budget
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: actual-budget
          image: actualbudget/actual-server:26.7.0
          imagePullPolicy: IfNotPresent
          env:
            - name: ACTUAL_DATA_DIR
              value: /data
            - name: ACTUAL_HOSTNAME
              value: "::"
            - name: ACTUAL_PORT
              value: "5006"
            - name: TZ
              value: America/Costa_Rica
          ports:
            - name: http
              containerPort: 5006
              protocol: TCP
          volumeMounts:
            - name: actual-budget-storage
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            exec:
              command:
                - node
                - scripts/health-check.js
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            exec:
              command:
                - node
                - scripts/health-check.js
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - node
                - scripts/health-check.js
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: actual-budget-storage
          persistentVolumeClaim:
            claimName: actual-budget-pvc
