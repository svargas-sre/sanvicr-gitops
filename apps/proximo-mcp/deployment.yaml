apiVersion: apps/v1
kind: Deployment
metadata:
  name: proximo-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: proximo-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proximo-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-secret-files
          image: ghcr.io/john-broadway/proximo:0.44.0
          command:
            - /bin/sh
            - -ec
          args:
            - |
              umask 077
              cp /secret-source/pve-token /run/proximo/pve-token
              cp /secret-source/mcp-bearer-token /run/proximo/mcp-bearer-token
              chmod 600 /run/proximo/pve-token /run/proximo/mcp-bearer-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: secret-source
              mountPath: /secret-source
              readOnly: true
            - name: runtime-secrets
              mountPath: /run/proximo
      containers:
        - name: proximo-mcp
          image: ghcr.io/john-broadway/proximo:0.44.0
          command:
            - proximo-mcp-http
          env:
            - name: PROXIMO_API_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: proximo-mcp
                  key: api-base-url
            - name: PROXIMO_NODE
              valueFrom:
                secretKeyRef:
                  name: proximo-mcp
                  key: node
            - name: PROXIMO_FINGERPRINT
              valueFrom:
                secretKeyRef:
                  name: proximo-mcp
                  key: fingerprint
            - name: PROXIMO_TOKEN_PATH
              value: /run/proximo/pve-token
            - name: PROXIMO_VERIFY_TLS
              value: "true"
            - name: PROXIMO_ENABLE_EXEC
              value: "false"
            - name: PROXIMO_ENABLE_AGENT
              value: "false"
            - name: PROXIMO_MEMORY
              value: "0"
            - name: PROXIMO_AUDIT_LOG
              value: /tmp/proximo-audit.log
            - name: PROXIMO_MCP_HTTP_HOST
              value: 0.0.0.0
            - name: PROXIMO_MCP_HTTP_PORT
              value: "41243"
            - name: PROXIMO_MCP_HTTP_TOKEN_FILE
              value: /run/proximo/mcp-bearer-token
            - name: PROXIMO_MCP_HTTP_ALLOWED_HOSTS
              value: proximo-mcp,proximo-mcp:41243,proximo-mcp.homelab-mcp.svc,proximo-mcp.homelab-mcp.svc:41243,proximo-mcp.homelab-mcp.svc.cluster.local,proximo-mcp.homelab-mcp.svc.cluster.local:41243,localhost,localhost:41243,127.0.0.1,127.0.0.1:41243
          ports:
            - name: http
              containerPort: 41243
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runtime-secrets
              mountPath: /run/proximo
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: secret-source
          secret:
            secretName: proximo-mcp
            defaultMode: 0440
            items:
              - key: pve-token
                path: pve-token
              - key: mcp-bearer-token
                path: mcp-bearer-token
        - name: runtime-secrets
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir:
            medium: Memory
